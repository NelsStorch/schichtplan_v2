<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Offizielles Cevi Dreieck (Rot #e11d48) -->
  <polygon points="50,92 8,18 92,18" fill="#e11d48" filter="url(#shadow)" />
  <!-- Innerer weisser Balken / Kontur -->
  <polygon points="50,82 16,24 84,24" fill="#ffffff" />
  <!-- Inneres rotes Dreieck -->
  <polygon points="50,74 22,28 78,28" fill="#e11d48" />
  <!-- Cevi Kreuz (Weiss) -->
  <rect x="45" y="36" width="10" height="26" fill="#ffffff" rx="1.5" />
  <rect x="37" y="44" width="26" height="10" fill="#ffffff" rx="1.5" />
</svg>
