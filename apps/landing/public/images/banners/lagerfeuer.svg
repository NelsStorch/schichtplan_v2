<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="fire-glow-main" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#7f1d1d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0503" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire-glow-pulse" cx="50%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky-fire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e100c"/>
      <stop offset="100%" stop-color="#3d1308"/>
    </linearGradient>
    <linearGradient id="flame-outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="flame-mid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <style>
      /* Ambient glow breathing */
      .glow-ambient {
        transform-origin: 800px 675px;
        animation: glow-breathe 3.6s ease-in-out infinite;
      }
      .glow-secondary {
        transform-origin: 800px 650px;
        animation: glow-flicker 2.1s ease-in-out infinite;
      }

      /* Stars twinkling in the night sky */
      .star {
        fill: #fff7ed;
        animation: star-twinkle 4s ease-in-out infinite;
      }
      .s1 { animation-delay: 0s; }
      .s2 { animation-delay: -1.1s; }
      .s3 { animation-delay: -2.3s; }
      .s4 { animation-delay: -3.2s; }

      /* Glowing embers on wood logs */
      .log-ember {
        animation: ember-pulse 2.4s ease-in-out infinite;
      }
      .log-ember-alt {
        animation: ember-pulse 1.9s ease-in-out -0.9s infinite;
      }

      /* Multi-layered flames pivoting around fire base (0, 30) */
      .flame-outer {
        transform-origin: 0px 30px;
        animation: flame-dance-outer 2.3s ease-in-out infinite;
      }
      .flame-outer-wisp {
        transform-origin: 0px 30px;
        animation: flame-dance-wisp 1.8s ease-in-out -0.7s infinite;
      }
      .flame-mid {
        transform-origin: 0px 30px;
        animation: flame-dance-mid 1.65s ease-in-out -0.4s infinite;
      }
      .flame-inner {
        transform-origin: 0px 30px;
        animation: flame-dance-inner 1.25s ease-in-out -0.2s infinite;
      }
      .flame-core {
        transform-origin: 0px 20px;
        animation: core-pulse 1.1s ease-in-out infinite;
      }

      /* Rising sparks */
      .spark {
        opacity: 0;
        animation: spark-rise 4.8s ease-out infinite;
      }
      .spark-fast {
        opacity: 0;
        animation: spark-rise-left 3.8s ease-out infinite;
      }
      .spark-wide {
        opacity: 0;
        animation: spark-rise-right 5.4s ease-out infinite;
      }

      @keyframes glow-breathe {
        0%, 100% { opacity: 0.92; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }

      @keyframes glow-flicker {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        35% { opacity: 0.9; transform: scale(1.06); }
        70% { opacity: 0.65; transform: scale(0.99); }
      }

      @keyframes star-twinkle {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 0.2; }
      }

      @keyframes ember-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      @keyframes flame-dance-outer {
        0%, 100% { transform: scale(1, 1) skewX(0deg); }
        25% { transform: scale(0.97, 1.06) skewX(-2.5deg); }
        55% { transform: scale(1.04, 0.95) skewX(2deg); }
        80% { transform: scale(0.99, 1.04) skewX(-1.2deg); }
      }

      @keyframes flame-dance-wisp {
        0%, 100% { transform: scale(1, 1) skewX(1.5deg); opacity: 0.85; }
        35% { transform: scale(1.05, 1.08) skewX(-3deg); opacity: 0.95; }
        70% { transform: scale(0.94, 0.93) skewX(2.5deg); opacity: 0.75; }
      }

      @keyframes flame-dance-mid {
        0%, 100% { transform: scale(1, 1) skewX(0deg); }
        30% { transform: scale(1.04, 0.94) skewX(3deg); }
        65% { transform: scale(0.96, 1.07) skewX(-2.5deg); }
      }

      @keyframes flame-dance-inner {
        0%, 100% { transform: scale(1, 1) skewX(0deg); }
        40% { transform: scale(0.94, 1.08) skewX(-2deg); }
        75% { transform: scale(1.06, 0.95) skewX(2.2deg); }
      }

      @keyframes core-pulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.1, 1.06); opacity: 1; }
      }

      @keyframes spark-rise {
        0% { opacity: 0; transform: translate(0px, 0px) scale(1); }
        12% { opacity: 0.95; }
        65% { opacity: 0.75; }
        100% { opacity: 0; transform: translate(28px, -340px) scale(0.35); }
      }

      @keyframes spark-rise-left {
        0% { opacity: 0; transform: translate(0px, 0px) scale(1); }
        15% { opacity: 0.95; }
        60% { opacity: 0.7; }
        100% { opacity: 0; transform: translate(-42px, -310px) scale(0.3); }
      }

      @keyframes spark-rise-right {
        0% { opacity: 0; transform: translate(0px, 0px) scale(1); }
        10% { opacity: 0.9; }
        70% { opacity: 0.65; }
        100% { opacity: 0; transform: translate(52px, -380px) scale(0.25); }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow-ambient,
        .glow-secondary,
        .star,
        .log-ember,
        .log-ember-alt,
        .flame-outer,
        .flame-outer-wisp,
        .flame-mid,
        .flame-inner,
        .flame-core,
        .spark,
        .spark-fast,
        .spark-wide {
          animation: none !important;
        }
        .spark, .spark-fast, .spark-wide {
          opacity: 0.75;
        }
      }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky-fire)"/>

  <!-- Subtle Night Stars -->
  <g>
    <circle class="star s1" cx="240" cy="95" r="1.6"/>
    <circle class="star s2" cx="410" cy="65" r="1.3"/>
    <circle class="star s3" cx="560" cy="120" r="1.8"/>
    <circle class="star s4" cx="690" cy="55" r="1.4"/>
    <circle class="star s2" cx="920" cy="60" r="1.5"/>
    <circle class="star s1" cx="1060" cy="110" r="1.7"/>
    <circle class="star s4" cx="1190" cy="70" r="1.3"/>
    <circle class="star s3" cx="1350" cy="105" r="1.6"/>
    <circle class="star s1" cx="480" cy="185" r="1.2"/>
    <circle class="star s3" cx="1120" cy="175" r="1.2"/>
  </g>

  <!-- Campfire Atmospheric Ambient Glow -->
  <rect class="glow-ambient" width="1600" height="900" fill="url(#fire-glow-main)"/>
  <rect class="glow-secondary" width="1600" height="900" fill="url(#fire-glow-pulse)"/>

  <!-- Forest Tree Silhouettes Left -->
  <g fill="#070403">
    <!-- Huge pine tree far left -->
    <polygon points="120,80 80,180 160,180"/>
    <polygon points="120,160 60,280 180,280"/>
    <polygon points="120,260 40,400 200,400"/>
    <polygon points="120,380 20,540 220,540"/>
    <polygon points="120,510 0,680 240,680"/>
    <rect x="105" y="680" width="30" height="150"/>

    <!-- Second pine tree mid-left -->
    <polygon points="320,180 280,280 360,280"/>
    <polygon points="320,260 260,380 380,380"/>
    <polygon points="320,360 240,500 400,500"/>
    <polygon points="320,480 220,640 420,640"/>
    <rect x="308" y="640" width="24" height="150"/>
  </g>

  <!-- Forest Tree Silhouettes Right -->
  <g fill="#070403">
    <!-- Huge pine tree far right -->
    <polygon points="1480,80 1440,180 1520,180"/>
    <polygon points="1480,160 1420,280 1540,280"/>
    <polygon points="1480,260 1400,400 1560,400"/>
    <polygon points="1480,380 1380,540 1580,540"/>
    <polygon points="1480,510 1360,680 1600,680"/>
    <rect x="1465" y="680" width="30" height="150"/>

    <!-- Second pine tree mid-right -->
    <polygon points="1280,180 1240,280 1320,280"/>
    <polygon points="1280,260 1220,380 1340,380"/>
    <polygon points="1280,360 1200,500 1360,500"/>
    <polygon points="1280,480 1180,640 1380,640"/>
    <rect x="1268" y="640" width="24" height="150"/>
  </g>

  <!-- Ground & Stone Fire Ring -->
  <path d="M0,740 Q400,720 800,725 T1600,735 L1600,900 L0,900 Z" fill="#080402"/>

  <!-- Campfire Stone Circle Pit -->
  <g transform="translate(800, 780)">
    <ellipse cx="-160" cy="10" rx="36" ry="22" fill="#262626"/>
    <ellipse cx="-110" cy="22" rx="42" ry="24" fill="#3f3f46"/>
    <ellipse cx="-45" cy="28" rx="46" ry="26" fill="#27272a"/>
    <ellipse cx="35" cy="28" rx="48" ry="25" fill="#3f3f46"/>
    <ellipse cx="105" cy="20" rx="42" ry="23" fill="#27272a"/>
    <ellipse cx="155" cy="10" rx="35" ry="20" fill="#3f3f46"/>
  </g>

  <!-- Glowing Wood Logs -->
  <g transform="translate(800, 730)">
    <!-- Log 1 (Left diagonal) -->
    <polygon points="-180,60 10,-30 40,-15 -150,75" fill="#3f1a0a"/>
    <polygon points="-160,50 0,-20 20,-10 -140,60" fill="#78350f"/>
    <!-- Glowing embers on log 1 -->
    <path class="log-ember" d="M-120,40 L-40,-5" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <path class="log-ember-alt" d="M-100,45 L-20,0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Log 2 (Right diagonal) -->
    <polygon points="180,60 -10,-30 -40,-15 150,75" fill="#2e1205"/>
    <polygon points="160,50 0,-20 -20,-10 140,60" fill="#78350f"/>
    <!-- Glowing embers on log 2 -->
    <path class="log-ember-alt" d="M120,40 L40,-5" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <path class="log-ember" d="M100,45 L20,0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center Base Logs -->
    <rect x="-110" y="30" width="220" height="28" rx="14" fill="#451a03"/>
    <rect class="log-ember" x="-80" y="36" width="160" height="16" rx="8" fill="#ea580c" opacity="0.85"/>
  </g>

  <!-- Blazing Fire Tongues -->
  <g transform="translate(800, 720)">
    <!-- Secondary Dancing Outer Flame Wisp -->
    <path class="flame-outer-wisp" d="M-105,30 C-125,-35 -95,-135 -45,-235 C-15,-175 10,-295 35,-330 C50,-245 85,-180 75,-110 C105,-145 130,-95 115,-30 C130,5 110,40 90,40 Z" fill="url(#flame-outer)"/>

    <!-- Outer Flame Silhouette -->
    <path class="flame-outer" d="M-120,30 C-100,-40 -120,-120 -60,-220 C-30,-150 -10,-280 15,-340 C35,-260 70,-190 60,-120 C90,-160 120,-110 110,-40 C140,-10 120,40 100,40 Z" fill="url(#flame-outer)"/>

    <!-- Mid Flame Silhouette -->
    <path class="flame-mid" d="M-90,30 C-70,-30 -80,-100 -40,-180 C-10,-120 10,-220 30,-270 C50,-200 80,-140 50,-80 C70,-110 90,-70 80,-20 C100,10 90,40 70,40 Z" fill="url(#flame-mid)"/>

    <!-- Inner Core Hot Flame -->
    <path class="flame-inner" d="M-60,30 C-50,-20 -50,-80 -20,-140 C0,-90 10,-170 25,-210 C40,-150 50,-100 35,-50 C50,-70 60,-40 50,-10 C60,10 50,40 40,40 Z" fill="url(#flame-inner)"/>

    <!-- White-hot base core -->
    <g class="flame-core">
      <ellipse cx="0" cy="20" rx="45" ry="35" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="5" cy="5" rx="30" ry="40" fill="#fef08a"/>
    </g>
  </g>

  <!-- Animated Flying Glowing Embers & Sparks -->
  <g fill="#fde047">
    <circle class="spark" style="animation-delay: 0s" cx="785" cy="480" r="3.6"/>
    <circle class="spark-fast" style="animation-delay: -0.6s" cx="815" cy="460" r="3"/>
    <circle class="spark-wide" style="animation-delay: -1.3s" cx="765" cy="490" r="3.2"/>
    <circle class="spark" style="animation-delay: -2.0s" cx="830" cy="440" r="2.6"/>
    <circle class="spark-fast" style="animation-delay: -2.7s" cx="795" cy="420" r="3.4"/>
    <circle class="spark-wide" style="animation-delay: -3.4s" cx="825" cy="470" r="2.8"/>
    <circle class="spark" style="animation-delay: -4.1s" cx="750" cy="450" r="2.5"/>
    <circle class="spark-fast" style="animation-delay: -1.7s" cx="855" cy="465" r="3"/>
    <circle class="spark-wide" style="animation-delay: -0.9s" cx="775" cy="390" r="2.4"/>
    <circle class="spark" style="animation-delay: -2.9s" cx="810" cy="370" r="2.2"/>
    <circle class="spark-fast" style="animation-delay: -3.8s" cx="735" cy="430" r="2.6"/>
    <circle class="spark-wide" style="animation-delay: -2.3s" cx="865" cy="410" r="2.2"/>
  </g>
</svg>
