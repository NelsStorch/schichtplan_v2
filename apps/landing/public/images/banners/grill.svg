<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky-grill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="45%" stop-color="#3b152d"/>
      <stop offset="75%" stop-color="#831843"/>
      <stop offset="90%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="grill-coal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ea580c" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky-grill)"/>

  <!-- Distant Trees & Village Silhouette -->
  <path d="M0,610 Q200,580 400,600 T800,590 T1200,610 T1600,580 L1600,900 L0,900 Z" fill="#1e1026" opacity="0.6"/>

  <!-- Festwirtschaft Pavilion Roof & Wooden Pergola (Background) -->
  <g transform="translate(100, 420)">
    <!-- Wooden support beams -->
    <rect x="50" y="80" width="16" height="260" fill="#291811"/>
    <rect x="350" y="80" width="16" height="260" fill="#291811"/>
    <rect x="650" y="80" width="16" height="260" fill="#291811"/>
    <!-- Cross beam -->
    <rect x="20" y="70" width="670" height="18" fill="#3f2418"/>

    <!-- Wooden Beer Garden Tables & Benches -->
    <!-- Table 1 -->
    <rect x="80" y="220" width="220" height="16" fill="#78350f"/>
    <polygon points="100,236 110,290 90,290 85,236" fill="#451a03"/>
    <polygon points="275,236 285,290 265,290 260,236" fill="#451a03"/>
    <!-- Bench 1 -->
    <rect x="70" y="250" width="240" height="10" fill="#92400e"/>

    <!-- Table 2 -->
    <rect x="380" y="220" width="220" height="16" fill="#78350f"/>
    <polygon points="400,236 410,290 390,290 385,236" fill="#451a03"/>
    <polygon points="575,236 585,290 565,290 560,236" fill="#451a03"/>
    <!-- Bench 2 -->
    <rect x="370" y="250" width="240" height="10" fill="#92400e"/>
  </g>

  <!-- Ground -->
  <path d="M0,710 Q500,690 1000,705 T1600,695 L1600,900 L0,900 Z" fill="#130912"/>

  <!-- Large Professional Grill Station (Foreground Right) -->
  <g transform="translate(1120, 520)">
    <!-- Warm grill glow underneath and around -->
    <ellipse cx="160" cy="120" rx="220" ry="90" fill="url(#grill-coal-glow)"/>

    <!-- Grill Body (Sturdy charcoal barbecue) -->
    <rect x="40" y="100" width="240" height="80" rx="8" fill="#18181b"/>
    <rect x="45" y="105" width="230" height="70" rx="6" fill="#27272a"/>

    <!-- Legs -->
    <line x1="60" y1="180" x2="40" y2="290" stroke="#18181b" stroke-width="12" stroke-linecap="round"/>
    <line x1="260" y1="180" x2="280" y2="290" stroke="#18181b" stroke-width="12" stroke-linecap="round"/>
    <line x1="60" y1="230" x2="260" y2="230" stroke="#27272a" stroke-width="6"/>

    <!-- Glowing Charcoal Bed -->
    <rect x="55" y="110" width="210" height="40" rx="4" fill="#7f1d1d"/>
    <!-- Hot Glowing Embers / Coals -->
    <ellipse cx="80" cy="130" rx="15" ry="8" fill="#f97316"/>
    <ellipse cx="115" cy="125" rx="18" ry="10" fill="#facc15"/>
    <ellipse cx="155" cy="132" rx="20" ry="9" fill="#ef4444"/>
    <ellipse cx="195" cy="127" rx="18" ry="11" fill="#facc15"/>
    <ellipse cx="230" cy="131" rx="16" ry="8" fill="#f97316"/>
    <ellipse cx="135" cy="135" rx="12" ry="6" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="175" cy="122" rx="14" ry="7" fill="#ffffff" opacity="0.9"/>

    <!-- Stainless Steel Grill Grate (Rost) -->
    <rect x="35" y="96" width="250" height="8" rx="3" fill="#cbd5e1"/>
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="50" y1="85" x2="50" y2="105"/>
      <line x1="70" y1="85" x2="70" y2="105"/>
      <line x1="90" y1="85" x2="90" y2="105"/>
      <line x1="110" y1="85" x2="110" y2="105"/>
      <line x1="130" y1="85" x2="130" y2="105"/>
      <line x1="150" y1="85" x2="150" y2="105"/>
      <line x1="170" y1="85" x2="170" y2="105"/>
      <line x1="190" y1="85" x2="190" y2="105"/>
      <line x1="210" y1="85" x2="210" y2="105"/>
      <line x1="230" y1="85" x2="230" y2="105"/>
      <line x1="250" y1="85" x2="250" y2="105"/>
      <line x1="270" y1="85" x2="270" y2="105"/>
    </g>

    <!-- Grilled Sausages / Bratwürste on the Grate -->
    <rect x="75" y="82" width="40" height="12" rx="6" fill="#78350f"/>
    <line x1="85" y1="84" x2="85" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="95" y1="84" x2="95" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="105" y1="84" x2="105" y2="92" stroke="#1c1917" stroke-width="2"/>

    <rect x="135" y="82" width="45" height="12" rx="6" fill="#92400e"/>
    <line x1="145" y1="84" x2="145" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="155" y1="84" x2="155" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="165" y1="84" x2="165" y2="92" stroke="#1c1917" stroke-width="2"/>

    <rect x="200" y="82" width="42" height="12" rx="6" fill="#78350f"/>
    <line x1="210" y1="84" x2="210" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="220" y1="84" x2="220" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="230" y1="84" x2="230" y2="92" stroke="#1c1917" stroke-width="2"/>

    <!-- Subtle Smoke Curling Up -->
    <path d="M100,75 C90,40 120,20 110,-10 C100,-40 130,-70 120,-110" fill="none" stroke="#f1f5f9" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
    <path d="M160,70 C170,30 140,10 155,-25 C170,-60 145,-90 160,-130" fill="none" stroke="#fed7aa" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
    <path d="M220,75 C230,45 205,15 220,-15 C235,-50 210,-80 225,-120" fill="none" stroke="#f1f5f9" stroke-width="4" opacity="0.25" stroke-linecap="round"/>
  </g>

  <!-- Festive Garland String with Lanterns across the sky -->
  <path d="M-20,220 Q400,380 900,280 T1620,200" fill="none" stroke="#475569" stroke-width="2.5"/>

  <!-- Glowing Yellow/Orange Lanterns -->
  <g>
    <!-- Lantern 1 -->
    <circle cx="160" cy="285" r="22" fill="url(#lamp-glow)"/>
    <rect x="153" y="275" width="14" height="20" rx="3" fill="#ea580c"/>
    <circle cx="160" cy="285" r="5" fill="#fef08a"/>
    <!-- Lantern 2 -->
    <circle cx="380" cy="335" r="24" fill="url(#lamp-glow)"/>
    <rect x="373" y="325" width="14" height="20" rx="3" fill="#f59e0b"/>
    <circle cx="380" cy="335" r="5" fill="#fef08a"/>
    <!-- Lantern 3 -->
    <circle cx="620" cy="340" r="24" fill="url(#lamp-glow)"/>
    <rect x="613" y="330" width="14" height="20" rx="3" fill="#ea580c"/>
    <circle cx="620" cy="340" r="5" fill="#fef08a"/>
    <!-- Lantern 4 -->
    <circle cx="860" cy="305" r="22" fill="url(#lamp-glow)"/>
    <rect x="853" y="295" width="14" height="20" rx="3" fill="#f59e0b"/>
    <circle cx="860" cy="305" r="5" fill="#fef08a"/>
    <!-- Lantern 5 -->
    <circle cx="1120" cy="265" r="24" fill="url(#lamp-glow)"/>
    <rect x="1113" y="255" width="14" height="20" rx="3" fill="#ea580c"/>
    <circle cx="1120" cy="265" r="5" fill="#fef08a"/>
    <!-- Lantern 6 -->
    <circle cx="1380" cy="230" r="22" fill="url(#lamp-glow)"/>
    <rect x="1373" y="220" width="14" height="20" rx="3" fill="#f59e0b"/>
    <circle cx="1380" cy="230" r="5" fill="#fef08a"/>
  </g>
</svg>
