<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Sunset / Twilight Sky -->
    <linearGradient id="sky-grill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="45%" stop-color="#3b152d"/>
      <stop offset="75%" stop-color="#831843"/>
      <stop offset="90%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Hot Glowing Charcoal Bed -->
    <radialGradient id="grill-coal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ea580c" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Hanging Lanterns / Lampions -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lamp-glow-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <style><![CDATA[
      /* Sanft und ruhig pulsierende Lampions - Felsenfest an der Kette verankert (nur Opazität!) */
      .lampion-glow {
        animation: lampion-breathe 3.4s ease-in-out infinite;
      }
      .lg-1 { animation-delay: 0s; }
      .lg-2 { animation-delay: -0.6s; }
      .lg-3 { animation-delay: -1.2s; }
      .lg-4 { animation-delay: -1.8s; }
      .lg-5 { animation-delay: -2.4s; }
      .lg-6 { animation-delay: -3.0s; }

      @keyframes lampion-breathe {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }

      /* Lebendige, warme Holzkohleglut (nur Opazität, kein Verspringen) */
      .coal-glow-ambient {
        animation: coal-glow-breathe 2.8s ease-in-out infinite;
      }
      @keyframes coal-glow-breathe {
        0%, 100% { opacity: 0.82; }
        50% { opacity: 1; }
      }

      .coal-core {
        animation: coal-heat-pulse 2.2s ease-in-out infinite;
      }
      .cc-1 { animation-delay: 0s; }
      .cc-2 { animation-delay: -0.7s; }
      .cc-3 { animation-delay: -1.4s; }

      @keyframes coal-heat-pulse {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      /* Zarter Grillrauch: Ruhig aufsteigend und verwehend (reines translateY/translateX) */
      .smoke-trail-1 {
        animation: grill-smoke-rise 5.5s ease-out infinite;
      }
      .smoke-trail-2 {
        animation: grill-smoke-rise 6.2s ease-out -2.7s infinite;
      }
      .smoke-trail-3 {
        animation: grill-smoke-rise 5.8s ease-out -4.1s infinite;
      }

      @keyframes grill-smoke-rise {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        20% {
          opacity: 0.38;
        }
        75% {
          opacity: 0.2;
        }
        100% {
          transform: translateY(-80px) translateX(20px);
          opacity: 0;
        }
      }

      /* Feine Funken vom Grill */
      .grill-spark {
        opacity: 0;
        animation: grill-spark-rise 3.4s ease-out infinite;
      }
      @keyframes grill-spark-rise {
        0% { opacity: 0; transform: translateY(0); }
        15% { opacity: 0.95; }
        70% { opacity: 0.65; }
        100% { opacity: 0; transform: translateY(-130px) translateX(15px); }
      }

      /* Abendsterne im oberen Dämmerungshimmel */
      .evening-star {
        animation: star-glow 4s ease-in-out infinite;
      }
      .es-1 { animation-delay: 0s; }
      .es-2 { animation-delay: -1.5s; }
      .es-3 { animation-delay: -2.8s; }

      @keyframes star-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }

      @media (prefers-reduced-motion: reduce) {
        .lampion-glow,
        .coal-glow-ambient,
        .coal-core,
        .smoke-trail-1,
        .smoke-trail-2,
        .smoke-trail-3,
        .grill-spark,
        .evening-star {
          animation: none !important;
        }
      }
    ]]></style>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky-grill)"/>

  <!-- Subtle Evening Stars in the upper violet sky -->
  <g fill="#fef08a">
    <circle class="evening-star es-1" cx="120" cy="80" r="1.5"/>
    <circle class="evening-star es-2" cx="240" cy="50" r="1.8"/>
    <circle class="evening-star es-3" cx="390" cy="110" r="1.4"/>
    <circle class="evening-star es-1" cx="540" cy="60" r="1.7"/>
    <circle class="evening-star es-2" cx="710" cy="95" r="1.5"/>
    <circle class="evening-star es-3" cx="850" cy="45" r="2.0"/>
    <circle class="evening-star es-2" cx="980" cy="75" r="1.6"/>
    <circle class="evening-star es-3" cx="1190" cy="120" r="1.3"/>
    <circle class="evening-star es-1" cx="1380" cy="65" r="1.6"/>
    <circle class="evening-star es-2" cx="1510" cy="100" r="1.4"/>
  </g>

  <!-- Distant Trees and Village Silhouette -->
  <path d="M0,610 Q200,580 400,600 T800,590 T1200,610 T1600,580 L1600,900 L0,900 Z" fill="#1e1026" opacity="0.6"/>

  <!-- Festwirtschaft Pavilion Roof and Wooden Pergola (Background Left) -->
  <g transform="translate(100, 420)">
    <!-- Wooden support beams -->
    <rect x="50" y="80" width="16" height="260" fill="#291811"/>
    <rect x="350" y="80" width="16" height="260" fill="#291811"/>
    <rect x="650" y="80" width="16" height="260" fill="#291811"/>
    <!-- Cross beam -->
    <rect x="20" y="70" width="670" height="18" fill="#3f2418"/>

    <!-- Wooden Beer Garden Tables and Benches (Festbänke) -->
    <!-- Table 1 -->
    <rect x="80" y="220" width="220" height="16" fill="#78350f"/>
    <polygon points="100,236 110,290 90,290 85,236" fill="#451a03"/>
    <polygon points="275,236 285,290 265,290 260,236" fill="#451a03"/>
    <!-- Bench 1 -->
    <rect x="70" y="250" width="240" height="10" fill="#92400e"/>

    <!-- Table 2 -->
    <rect x="380" y="220" width="220" height="16" fill="#78350f"/>
    <polygon points="400,236 410,290 390,290 385,236" fill="#451a03"/>
    <polygon points="575,236 585,290 565,290 560,236" fill="#451a03"/>
    <!-- Bench 2 -->
    <rect x="370" y="250" width="240" height="10" fill="#92400e"/>
  </g>

  <!-- Ground -->
  <path d="M0,710 Q500,690 1000,705 T1600,695 L1600,900 L0,900 Z" fill="#130912"/>

  <!-- Large Professional Charcoal Barbecue Grill Station (Foreground Right at 1120, 520) -->
  <g transform="translate(1120, 520)">
    <!-- Warm grill glow underneath and radiating around -->
    <ellipse class="coal-glow-ambient" cx="160" cy="120" rx="220" ry="90" fill="url(#grill-coal-glow)"/>

    <!-- Grill Body (Sturdy charcoal barbecue) -->
    <rect x="40" y="100" width="240" height="80" rx="8" fill="#18181b"/>
    <rect x="45" y="105" width="230" height="70" rx="6" fill="#27272a"/>

    <!-- Grill Legs -->
    <line x1="60" y1="180" x2="40" y2="290" stroke="#18181b" stroke-width="12" stroke-linecap="round"/>
    <line x1="260" y1="180" x2="280" y2="290" stroke="#18181b" stroke-width="12" stroke-linecap="round"/>
    <line x1="60" y1="230" x2="260" y2="230" stroke="#27272a" stroke-width="6"/>

    <!-- Glowing Charcoal Bed (Dunkle Glutwanne) -->
    <rect x="55" y="110" width="210" height="40" rx="4" fill="#7f1d1d"/>

    <!-- Hot Glowing Embers / Coals with lively, breathing warmth -->
    <g class="coal-glow-ambient">
      <ellipse cx="80" cy="130" rx="15" ry="8" fill="#f97316"/>
      <ellipse cx="115" cy="125" rx="18" ry="10" fill="#facc15"/>
      <ellipse cx="155" cy="132" rx="20" ry="9" fill="#ef4444"/>
      <ellipse cx="195" cy="127" rx="18" ry="11" fill="#facc15"/>
      <ellipse cx="230" cy="131" rx="16" ry="8" fill="#f97316"/>
    </g>

    <!-- White-hot and golden ember cores -->
    <ellipse class="coal-core cc-1" cx="135" cy="135" rx="13" ry="6" fill="#ffffff" opacity="0.95"/>
    <ellipse class="coal-core cc-2" cx="175" cy="122" rx="15" ry="7" fill="#ffffff" opacity="0.95"/>
    <ellipse class="coal-core cc-3" cx="105" cy="130" rx="10" ry="5" fill="#fef08a" opacity="0.9"/>
    <ellipse class="coal-core cc-2" cx="210" cy="128" rx="11" ry="5" fill="#fef08a" opacity="0.9"/>

    <!-- Stainless Steel Grill Grate (Rost) -->
    <rect x="35" y="96" width="250" height="8" rx="3" fill="#cbd5e1"/>
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="50" y1="85" x2="50" y2="105"/>
      <line x1="70" y1="85" x2="70" y2="105"/>
      <line x1="90" y1="85" x2="90" y2="105"/>
      <line x1="110" y1="85" x2="110" y2="105"/>
      <line x1="130" y1="85" x2="130" y2="105"/>
      <line x1="150" y1="85" x2="150" y2="105"/>
      <line x1="170" y1="85" x2="170" y2="105"/>
      <line x1="190" y1="85" x2="190" y2="105"/>
      <line x1="210" y1="85" x2="210" y2="105"/>
      <line x1="230" y1="85" x2="230" y2="105"/>
      <line x1="250" y1="85" x2="250" y2="105"/>
      <line x1="270" y1="85" x2="270" y2="105"/>
    </g>

    <!-- Grilled Sausages / Bratwürste on the Grate -->
    <!-- Wurst 1 -->
    <rect x="75" y="82" width="40" height="12" rx="6" fill="#78350f"/>
    <line x1="85" y1="84" x2="85" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="95" y1="84" x2="95" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="105" y1="84" x2="105" y2="92" stroke="#1c1917" stroke-width="2"/>

    <!-- Wurst 2 -->
    <rect x="135" y="82" width="45" height="12" rx="6" fill="#92400e"/>
    <line x1="145" y1="84" x2="145" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="155" y1="84" x2="155" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="165" y1="84" x2="165" y2="92" stroke="#1c1917" stroke-width="2"/>

    <!-- Wurst 3 -->
    <rect x="200" y="82" width="42" height="12" rx="6" fill="#78350f"/>
    <line x1="210" y1="84" x2="210" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="220" y1="84" x2="220" y2="92" stroke="#1c1917" stroke-width="2"/>
    <line x1="230" y1="84" x2="230" y2="92" stroke="#1c1917" stroke-width="2"/>

    <!-- Aromatic Barbecue Smoke Wisps Curling Up from the Grill -->
    <path class="smoke-trail-1" d="M100,75 C90,40 120,20 110,-10 C100,-40 130,-70 120,-110" fill="none" stroke="#f1f5f9" stroke-width="4.5" stroke-linecap="round"/>
    <path class="smoke-trail-2" d="M160,70 C170,30 140,10 155,-25 C170,-60 145,-90 160,-130" fill="none" stroke="#fed7aa" stroke-width="5.5" stroke-linecap="round"/>
    <path class="smoke-trail-3" d="M220,75 C230,45 205,15 220,-15 C235,-50 210,-80 225,-120" fill="none" stroke="#f1f5f9" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Feine glühende Grillfunken -->
    <circle class="grill-spark" style="animation-delay: 0s" cx="130" cy="70" r="2.2" fill="#fef08a"/>
    <circle class="grill-spark" style="animation-delay: -1.1s" cx="170" cy="65" r="2.5" fill="#fde047"/>
    <circle class="grill-spark" style="animation-delay: -2.3s" cx="195" cy="75" r="1.9" fill="#f97316"/>
  </g>

  <!-- Festive Garland String with Lanterns across the sky -->
  <!-- Wire path calculated: (-20, 220) Q (400, 380) 900,280 T (1620, 200) -->
  <path d="M-20,220 Q400,380 900,280 T1620,200" fill="none" stroke="#475569" stroke-width="2.5"/>

  <!-- 6 Festoon Lanterns / Lampions - EXAKT und nahtlos an der Kette montiert -->
  <!-- Lantern 1 (x: 160, wire y: 276) -->
  <g>
    <!-- Dark Socket Clamp on the cable -->
    <rect x="157" y="274" width="6" height="4" rx="1" fill="#1e293b"/>
    <!-- Lantern body hanging directly from clamp -->
    <rect x="153" y="277" width="14" height="20" rx="3" fill="#ea580c"/>
    <!-- Inner glowing light bulb -->
    <circle cx="160" cy="287" r="5" fill="#fef08a"/>
    <!-- Ambient atmospheric lantern glow -->
    <circle class="lampion-glow lg-1" cx="160" cy="287" r="24" fill="url(#lamp-glow)"/>
  </g>

  <!-- Lantern 2 (x: 380, wire y: 312) -->
  <g>
    <!-- Dark Socket Clamp on the cable -->
    <rect x="377" y="310" width="6" height="4" rx="1" fill="#1e293b"/>
    <!-- Lantern body hanging directly from clamp -->
    <rect x="373" y="313" width="14" height="20" rx="3" fill="#f59e0b"/>
    <!-- Inner glowing light bulb -->
    <circle cx="380" cy="323" r="5" fill="#fef08a"/>
    <!-- Ambient atmospheric lantern glow -->
    <circle class="lampion-glow lg-2" cx="380" cy="323" r="26" fill="url(#lamp-glow-orange)"/>
  </g>

  <!-- Lantern 3 (x: 620, wire y: 316) -->
  <g>
    <!-- Dark Socket Clamp on the cable -->
    <rect x="617" y="314" width="6" height="4" rx="1" fill="#1e293b"/>
    <!-- Lantern body hanging directly from clamp -->
    <rect x="613" y="317" width="14" height="20" rx="3" fill="#ea580c"/>
    <!-- Inner glowing light bulb -->
    <circle cx="620" cy="327" r="5" fill="#fef08a"/>
    <!-- Ambient atmospheric lantern glow -->
    <circle class="lampion-glow lg-3" cx="620" cy="327" r="26" fill="url(#lamp-glow)"/>
  </g>

  <!-- Lantern 4 (x: 860, wire y: 288) -->
  <g>
    <!-- Dark Socket Clamp on the cable -->
    <rect x="857" y="286" width="6" height="4" rx="1" fill="#1e293b"/>
    <!-- Lantern body hanging directly from clamp -->
    <rect x="853" y="289" width="14" height="20" rx="3" fill="#f59e0b"/>
    <!-- Inner glowing light bulb -->
    <circle cx="860" cy="299" r="5" fill="#fef08a"/>
    <!-- Ambient atmospheric lantern glow -->
    <circle class="lampion-glow lg-4" cx="860" cy="299" r="24" fill="url(#lamp-glow-orange)"/>
  </g>

  <!-- Lantern 5 (x: 1120, wire y: 240) -->
  <g>
    <!-- Dark Socket Clamp on the cable -->
    <rect x="1117" y="238" width="6" height="4" rx="1" fill="#1e293b"/>
    <!-- Lantern body hanging directly from clamp -->
    <rect x="1113" y="241" width="14" height="20" rx="3" fill="#ea580c"/>
    <!-- Inner glowing light bulb -->
    <circle cx="1120" cy="251" r="5" fill="#fef08a"/>
    <!-- Ambient atmospheric lantern glow -->
    <circle class="lampion-glow lg-5" cx="1120" cy="251" r="26" fill="url(#lamp-glow)"/>
  </g>

  <!-- Lantern 6 (x: 1380, wire y: 205) -->
  <g>
    <!-- Dark Socket Clamp on the cable -->
    <rect x="1377" y="203" width="6" height="4" rx="1" fill="#1e293b"/>
    <!-- Lantern body hanging directly from clamp -->
    <rect x="1373" y="206" width="14" height="20" rx="3" fill="#f59e0b"/>
    <!-- Inner glowing light bulb -->
    <circle cx="1380" cy="216" r="5" fill="#fef08a"/>
    <!-- Ambient atmospheric lantern glow -->
    <circle class="lampion-glow lg-6" cx="1380" cy="216" r="24" fill="url(#lamp-glow-orange)"/>
  </g>
</svg>
