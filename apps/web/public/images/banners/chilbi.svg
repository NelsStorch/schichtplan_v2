<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky-chilbi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="85%" stop-color="#732e6c"/>
      <stop offset="100%" stop-color="#ff7e5f"/>
    </linearGradient>
    <linearGradient id="ground-chilbi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241332"/>
      <stop offset="100%" stop-color="#0d0614"/>
    </linearGradient>
    <linearGradient id="tent-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb-glow-alt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tent-light" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky-beam-1" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ff7e5f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky-beam-2" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#e879f9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <style>
      /* Fairground Sky Searchlights */
      .sky-beam-left {
        transform-origin: 900px 700px;
        animation: beam-sweep-left 9s ease-in-out infinite alternate;
      }
      .sky-beam-right {
        transform-origin: 1350px 720px;
        animation: beam-sweep-right 12s ease-in-out infinite alternate;
      }

      /* Stars in the upper twilight sky */
      .star {
        fill: #fdf2f8;
        animation: star-twinkle 3.6s ease-in-out infinite;
      }
      .s1 { animation-delay: 0s; }
      .s2 { animation-delay: -1.2s; }
      .s3 { animation-delay: -2.1s; }
      .s4 { animation-delay: -2.9s; }

      /* Turning Ferris Wheel (Riesenrad) */
      .ferris-wheel-spin {
        transform-origin: 0px 0px;
        animation: ferris-rotate 34s linear infinite;
      }

      /* Glowing Gondolas counter-rotation so cabins stay upright */
      .gondola-counter {
        animation: gondola-level 34s linear infinite;
      }

      /* Festoon light bulbs: glowing warm pulse */
      .bulb-pulse {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: bulb-glow-anim 2.2s ease-in-out infinite;
      }
      .b1 { animation-delay: 0s; }
      .b2 { animation-delay: -0.48s; }
      .b3 { animation-delay: -0.96s; }
      .b4 { animation-delay: -1.44s; }
      .b5 { animation-delay: -1.92s; }
      .b6 { animation-delay: -0.3s; }
      .b7 { animation-delay: -0.78s; }
      .b8 { animation-delay: -1.26s; }
      .b9 { animation-delay: -1.74s; }

      /* Festzelt interior warm glow breathing */
      .tent-glow {
        transform-origin: 280px 220px;
        animation: tent-breathe 3.2s ease-in-out infinite;
      }

      /* Food stall warm counter glow */
      .stall-glow {
        animation: stall-breathe 2.6s ease-in-out infinite alternate;
      }

      /* Flags waving in the evening breeze */
      .tent-flag-main {
        transform-origin: 280px -35px;
        animation: flag-wave 1.6s ease-in-out infinite;
      }
      .tent-flag-sub {
        transform-origin: 140px -20px;
        animation: flag-wave 1.9s ease-in-out -0.6s infinite;
      }

      /* Triangular pennants (Wimpelkette) fluttering */
      .pennant {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: pennant-flutter 2.6s ease-in-out infinite;
      }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: -0.22s; }
      .p3 { animation-delay: -0.44s; }
      .p4 { animation-delay: -0.66s; }
      .p5 { animation-delay: -0.88s; }
      .p6 { animation-delay: -1.10s; }
      .p7 { animation-delay: -1.32s; }
      .p8 { animation-delay: -1.54s; }
      .p9 { animation-delay: -1.76s; }
      .p10 { animation-delay: -1.98s; }
      .p11 { animation-delay: -2.20s; }
      .p12 { animation-delay: -2.42s; }
      .p13 { animation-delay: -0.15s; }

      @keyframes beam-sweep-left {
        0% { transform: rotate(-18deg); opacity: 0.65; }
        50% { opacity: 0.95; }
        100% { transform: rotate(14deg); opacity: 0.7; }
      }

      @keyframes beam-sweep-right {
        0% { transform: rotate(16deg); opacity: 0.8; }
        50% { opacity: 0.6; }
        100% { transform: rotate(-20deg); opacity: 0.95; }
      }

      @keyframes star-twinkle {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 0.2; transform: scale(0.8); }
      }

      @keyframes ferris-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes gondola-level {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }

      @keyframes bulb-glow-anim {
        0%, 100% { transform: scale(0.92); opacity: 0.75; }
        50% { transform: scale(1.12); opacity: 1; }
      }

      @keyframes tent-breathe {
        0%, 100% { opacity: 0.8; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.04); }
      }

      @keyframes stall-breathe {
        0% { opacity: 0.65; }
        100% { opacity: 0.95; }
      }

      @keyframes flag-wave {
        0%, 100% { transform: scaleX(1) skewY(0deg); }
        35% { transform: scaleX(0.94) skewY(-3.5deg); }
        70% { transform: scaleX(1.03) skewY(2.5deg); }
      }

      @keyframes pennant-flutter {
        0%, 100% { transform: rotate(-4deg) skewX(-2.5deg); }
        50% { transform: rotate(5deg) skewX(3deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .sky-beam-left,
        .sky-beam-right,
        .star,
        .ferris-wheel-spin,
        .gondola-counter,
        .bulb-pulse,
        .tent-glow,
        .stall-glow,
        .tent-flag-main,
        .tent-flag-sub,
        .pennant {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky-chilbi)"/>

  <!-- Subtle Night Stars -->
  <g>
    <circle class="star s1" cx="160" cy="80" r="1.5"/>
    <circle class="star s2" cx="340" cy="110" r="1.3"/>
    <circle class="star s3" cx="520" cy="65" r="1.8"/>
    <circle class="star s4" cx="740" cy="95" r="1.4"/>
    <circle class="star s1" cx="950" cy="70" r="1.6"/>
    <circle class="star s3" cx="1140" cy="120" r="1.3"/>
    <circle class="star s2" cx="1380" cy="75" r="1.7"/>
    <circle class="star s4" cx="1510" cy="105" r="1.4"/>
    <circle class="star s2" cx="240" cy="160" r="1.2"/>
    <circle class="star s4" cx="630" cy="140" r="1.2"/>
    <circle class="star s1" cx="1260" cy="150" r="1.3"/>
  </g>

  <!-- Fairground Searchlight Sky Beams -->
  <g>
    <!-- Left sweeping beam -->
    <polygon class="sky-beam-left" points="890,700 810,0 970,0 910,700" fill="url(#sky-beam-1)"/>
    <!-- Right sweeping beam -->
    <polygon class="sky-beam-right" points="1340,720 1230,0 1430,0 1360,720" fill="url(#sky-beam-2)"/>
  </g>

  <!-- Distant Ferris Wheel / Lights -->
  <g opacity="0.65" transform="translate(1300, 480)">
    <!-- Ferris Wheel Support Stand (static) -->
    <polygon points="-35,170 35,170 0,0" fill="#311042"/>
    <polygon points="-25,170 25,170 0,0" fill="#4a154b" opacity="0.6"/>

    <!-- Rotating Ferris Wheel Assembly -->
    <g class="ferris-wheel-spin">
      <!-- Outer Rim Rings -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="#fed7aa" stroke-width="3.5" stroke-dasharray="14,9"/>
      <circle cx="0" cy="0" r="148" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#fbcfe8" stroke-width="2"/>
      <circle cx="0" cy="0" r="30" fill="#4a154b" stroke="#fed7aa" stroke-width="2.5"/>

      <!-- Spokes -->
      <line x1="-160" y1="0" x2="160" y2="0" stroke="#fed7aa" stroke-width="2"/>
      <line x1="0" y1="-160" x2="0" y2="160" stroke="#fed7aa" stroke-width="2"/>
      <line x1="-113" y1="-113" x2="113" y2="113" stroke="#fed7aa" stroke-width="2"/>
      <line x1="-113" y1="113" x2="113" y2="-113" stroke="#fed7aa" stroke-width="2"/>

      <!-- 8 Passenger Gondolas (Keep upright via counter-rotation) -->
      <!-- Gondola 1: Top (0, -160) -->
      <g transform="translate(0, -160)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
      <!-- Gondola 2: Top-Right (113, -113) -->
      <g transform="translate(113, -113)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#f43f5e"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
      <!-- Gondola 3: Right (160, 0) -->
      <g transform="translate(160, 0)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
      <!-- Gondola 4: Bottom-Right (113, 113) -->
      <g transform="translate(113, 113)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#34d399"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
      <!-- Gondola 5: Bottom (0, 160) -->
      <g transform="translate(0, 160)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
      <!-- Gondola 6: Bottom-Left (-113, 113) -->
      <g transform="translate(-113, 113)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#f43f5e"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
      <!-- Gondola 7: Left (-160, 0) -->
      <g transform="translate(-160, 0)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
      <!-- Gondola 8: Top-Left (-113, -113) -->
      <g transform="translate(-113, -113)">
        <g class="gondola-counter">
          <circle cx="0" cy="0" r="7" fill="#34d399"/>
          <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        </g>
      </g>
    </g>

    <!-- Glowing Center Hub -->
    <circle cx="0" cy="0" r="9" fill="#fef08a"/>
  </g>

  <!-- Distant Silhouette Skyline / Trees -->
  <path d="M0,640 Q200,610 400,630 T800,620 T1200,635 T1600,610 L1600,900 L0,900 Z" fill="#1b0c2a" opacity="0.7"/>

  <!-- Festzelt (Main Tent) -->
  <g transform="translate(260, 430)">
    <!-- Tent glow from inside -->
    <ellipse class="tent-glow" cx="280" cy="220" rx="330" ry="150" fill="url(#tent-light)"/>

    <!-- Main Tent Peak -->
    <polygon points="280,0 20,180 540,180" fill="url(#tent-roof)"/>
    <!-- Tent Walls -->
    <polygon points="30,180 530,180 550,320 10,320" fill="#fff" opacity="0.9"/>

    <!-- Tent entrance with warm light -->
    <polygon points="220,320 250,220 310,220 340,320" fill="#fef08a"/>
    <polygon points="240,320 260,230 300,230 320,320" fill="#f59e0b"/>

    <!-- Center pole flag waving -->
    <line x1="280" y1="0" x2="280" y2="-50" stroke="#e2e8f0" stroke-width="4"/>
    <polygon class="tent-flag-main" points="280,-50 345,-35 280,-20" fill="#dc2626"/>

    <!-- Side pennants on roof -->
    <line x1="20" y1="180" x2="280" y2="0" stroke="#f8fafc" stroke-width="3"/>
    <line x1="280" y1="0" x2="540" y2="180" stroke="#f8fafc" stroke-width="3"/>
  </g>

  <!-- Secondary Smaller Festival Pavilion / Food Stall -->
  <g transform="translate(860, 500)">
    <polygon points="140,0 0,90 280,90" fill="#b91c1c"/>
    <rect x="20" y="90" width="240" height="90" fill="#fef3c7"/>
    <rect x="40" y="110" width="200" height="50" fill="#451a03"/>
    <!-- Counter warm light -->
    <ellipse class="stall-glow" cx="140" cy="135" rx="95" ry="24" fill="#fef08a" opacity="0.75"/>
    <line x1="140" y1="0" x2="140" y2="-30" stroke="#94a3b8" stroke-width="3"/>
    <polygon class="tent-flag-sub" points="140,-30 185,-20 140,-10" fill="#fbbf24"/>
  </g>

  <!-- Ground -->
  <path d="M0,720 Q400,700 800,715 T1600,690 L1600,900 L0,900 Z" fill="url(#ground-chilbi)"/>

  <!-- Light Poles & Strings of Festoon Lights (Garlands) -->
  <!-- Wire 1: Left to Center Tent -->
  <path d="M-20,180 Q320,340 600,240 T1100,220 T1620,160" fill="none" stroke="#475569" stroke-width="3"/>
  <!-- Wire 2: Lower sweeping string -->
  <path d="M-20,290 Q400,420 850,330 T1620,280" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Glowing Light Bulbs along Wire 1 (with pulsing halo) -->
  <!-- Bulb 1 -->
  <g class="bulb-pulse b1" transform="translate(120, 250)">
    <circle cx="0" cy="0" r="18" fill="url(#bulb-glow)"/>
    <circle cx="0" cy="0" r="6" fill="#fff"/>
  </g>
  <!-- Bulb 2 -->
  <g class="bulb-pulse b2" transform="translate(260, 295)">
    <circle cx="0" cy="0" r="20" fill="url(#bulb-glow-alt)"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
  </g>
  <!-- Bulb 3 -->
  <g class="bulb-pulse b3" transform="translate(410, 305)">
    <circle cx="0" cy="0" r="20" fill="url(#bulb-glow)"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
  </g>
  <!-- Bulb 4 -->
  <g class="bulb-pulse b4" transform="translate(560, 265)">
    <circle cx="0" cy="0" r="18" fill="url(#bulb-glow)"/>
    <circle cx="0" cy="0" r="6" fill="#fff"/>
  </g>
  <!-- Bulb 5 -->
  <g class="bulb-pulse b5" transform="translate(720, 245)">
    <circle cx="0" cy="0" r="20" fill="url(#bulb-glow-alt)"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
  </g>
  <!-- Bulb 6 -->
  <g class="bulb-pulse b6" transform="translate(890, 240)">
    <circle cx="0" cy="0" r="20" fill="url(#bulb-glow)"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
  </g>
  <!-- Bulb 7 -->
  <g class="bulb-pulse b7" transform="translate(1060, 225)">
    <circle cx="0" cy="0" r="18" fill="url(#bulb-glow)"/>
    <circle cx="0" cy="0" r="6" fill="#fff"/>
  </g>
  <!-- Bulb 8 -->
  <g class="bulb-pulse b8" transform="translate(1240, 205)">
    <circle cx="0" cy="0" r="20" fill="url(#bulb-glow-alt)"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
  </g>
  <!-- Bulb 9 -->
  <g class="bulb-pulse b9" transform="translate(1420, 180)">
    <circle cx="0" cy="0" r="20" fill="url(#bulb-glow)"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
  </g>

  <!-- Triangular Pennant Flags (Wimpelkette) fluttering from Wire 2 -->
  <polygon class="pennant p1" points="100,320 135,327 117,370" fill="#ef4444"/>
  <polygon class="pennant p2" points="200,342 235,350 217,395" fill="#3b82f6"/>
  <polygon class="pennant p3" points="300,363 335,370 317,415" fill="#fbbf24"/>
  <polygon class="pennant p4" points="410,377 445,380 427,425" fill="#10b981"/>
  <polygon class="pennant p5" points="520,380 555,379 537,424" fill="#ec4899"/>
  <polygon class="pennant p6" points="630,373 665,368 647,413" fill="#8b5cf6"/>
  <polygon class="pennant p7" points="740,358 775,352 757,398" fill="#f97316"/>
  <polygon class="pennant p8" points="850,336 885,329 867,374" fill="#06b6d4"/>
  <polygon class="pennant p9" points="970,314 1005,307 987,352" fill="#ef4444"/>
  <polygon class="pennant p10" points="1090,296 1125,291 1107,336" fill="#fbbf24"/>
  <polygon class="pennant p11" points="1210,282 1245,278 1227,323" fill="#3b82f6"/>
  <polygon class="pennant p12" points="1340,273 1375,271 1357,316" fill="#10b981"/>
  <polygon class="pennant p13" points="1470,270 1505,271 1487,316" fill="#f97316"/>
</svg>
