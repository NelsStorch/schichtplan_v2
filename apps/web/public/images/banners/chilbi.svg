<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky-chilbi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="85%" stop-color="#732e6c"/>
      <stop offset="100%" stop-color="#ff7e5f"/>
    </linearGradient>
    <linearGradient id="ground-chilbi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241332"/>
      <stop offset="100%" stop-color="#0d0614"/>
    </linearGradient>
    <linearGradient id="tent-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tent-light" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky-chilbi)"/>

  <!-- Distant Ferris Wheel / Lights -->
  <g opacity="0.4" transform="translate(1300, 480)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#fed7aa" stroke-width="3" stroke-dasharray="12,8"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fbcfe8" stroke-width="2"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#fed7aa" stroke-width="2"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#fed7aa" stroke-width="2"/>
    <line x1="-113" y1="-113" x2="113" y2="113" stroke="#fed7aa" stroke-width="2"/>
    <line x1="-113" y1="113" x2="113" y2="-113" stroke="#fed7aa" stroke-width="2"/>
    <polygon points="-30,160 30,160 0,0" fill="#311042"/>
  </g>

  <!-- Distant Silhouette Skyline / Trees -->
  <path d="M0,640 Q200,610 400,630 T800,620 T1200,635 T1600,610 L1600,900 L0,900 Z" fill="#1b0c2a" opacity="0.7"/>

  <!-- Festzelt (Main Tent) -->
  <g transform="translate(260, 430)">
    <!-- Tent glow from inside -->
    <ellipse cx="280" cy="220" rx="320" ry="140" fill="url(#tent-light)"/>

    <!-- Main Tent Peak -->
    <polygon points="280,0 20,180 540,180" fill="url(#tent-roof)"/>
    <!-- Tent Walls -->
    <polygon points="30,180 530,180 550,320 10,320" fill="#fff" opacity="0.9"/>
    <!-- Tent entrance with warm light -->
    <polygon points="220,320 250,220 310,220 340,320" fill="#fef08a"/>
    <polygon points="240,320 260,230 300,230 320,320" fill="#f59e0b"/>
    <!-- Center pole flag -->
    <line x1="280" y1="0" x2="280" y2="-50" stroke="#e2e8f0" stroke-width="4"/>
    <polygon points="280,-50 340,-35 280,-20" fill="#dc2626"/>
    <!-- Side pennants on roof -->
    <line x1="20" y1="180" x2="280" y2="0" stroke="#f8fafc" stroke-width="3"/>
    <line x1="280" y1="0" x2="540" y2="180" stroke="#f8fafc" stroke-width="3"/>
  </g>

  <!-- Secondary Smaller Festival Pavilion / Food Stall -->
  <g transform="translate(860, 500)">
    <polygon points="140,0 0,90 280,90" fill="#b91c1c"/>
    <rect x="20" y="90" width="240" height="90" fill="#fef3c7"/>
    <rect x="40" y="110" width="200" height="50" fill="#451a03"/>
    <!-- Counter warm light -->
    <ellipse cx="140" cy="135" rx="90" ry="20" fill="#fef08a" opacity="0.7"/>
    <line x1="140" y1="0" x2="140" y2="-30" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="140,-30 180,-20 140,-10" fill="#fbbf24"/>
  </g>

  <!-- Ground -->
  <path d="M0,720 Q400,700 800,715 T1600,690 L1600,900 L0,900 Z" fill="url(#ground-chilbi)"/>

  <!-- Light Poles & Strings of Festoon Lights (Garlands) -->
  <!-- Wire 1: Left to Center Tent -->
  <path d="M-20,180 Q320,340 600,240 T1100,220 T1620,160" fill="none" stroke="#475569" stroke-width="3"/>
  <!-- Wire 2: Lower sweeping string -->
  <path d="M-20,290 Q400,420 850,330 T1620,280" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Glowing Light Bulbs along Wire 1 -->
  <!-- Bulb 1 -->
  <circle cx="120" cy="250" r="16" fill="url(#bulb-glow)"/>
  <circle cx="120" cy="250" r="6" fill="#fff"/>
  <!-- Bulb 2 -->
  <circle cx="260" cy="295" r="18" fill="url(#bulb-glow)"/>
  <circle cx="260" cy="295" r="7" fill="#fff"/>
  <!-- Bulb 3 -->
  <circle cx="410" cy="305" r="18" fill="url(#bulb-glow)"/>
  <circle cx="410" cy="305" r="7" fill="#fff"/>
  <!-- Bulb 4 -->
  <circle cx="560" cy="265" r="16" fill="url(#bulb-glow)"/>
  <circle cx="560" cy="265" r="6" fill="#fff"/>
  <!-- Bulb 5 -->
  <circle cx="720" cy="245" r="18" fill="url(#bulb-glow)"/>
  <circle cx="720" cy="245" r="7" fill="#fff"/>
  <!-- Bulb 6 -->
  <circle cx="890" cy="240" r="18" fill="url(#bulb-glow)"/>
  <circle cx="890" cy="240" r="7" fill="#fff"/>
  <!-- Bulb 7 -->
  <circle cx="1060" cy="225" r="16" fill="url(#bulb-glow)"/>
  <circle cx="1060" cy="225" r="6" fill="#fff"/>
  <!-- Bulb 8 -->
  <circle cx="1240" cy="205" r="18" fill="url(#bulb-glow)"/>
  <circle cx="1240" cy="205" r="7" fill="#fff"/>
  <!-- Bulb 9 -->
  <circle cx="1420" cy="180" r="18" fill="url(#bulb-glow)"/>
  <circle cx="1420" cy="180" r="7" fill="#fff"/>

  <!-- Triangular Pennant Flags hanging from Wire 2 -->
  <polygon points="100,320 135,327 117,370" fill="#ef4444"/>
  <polygon points="200,342 235,350 217,395" fill="#3b82f6"/>
  <polygon points="300,363 335,370 317,415" fill="#fbbf24"/>
  <polygon points="410,377 445,380 427,425" fill="#10b981"/>
  <polygon points="520,380 555,379 537,424" fill="#ec4899"/>
  <polygon points="630,373 665,368 647,413" fill="#8b5cf6"/>
  <polygon points="740,358 775,352 757,398" fill="#f97316"/>
  <polygon points="850,336 885,329 867,374" fill="#06b6d4"/>
  <polygon points="970,314 1005,307 987,352" fill="#ef4444"/>
  <polygon points="1090,296 1125,291 1107,336" fill="#fbbf24"/>
  <polygon points="1210,282 1245,278 1227,323" fill="#3b82f6"/>
  <polygon points="1340,273 1375,271 1357,316" fill="#10b981"/>
  <polygon points="1470,270 1505,271 1487,316" fill="#f97316"/>
</svg>
