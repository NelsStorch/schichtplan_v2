<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="fire-glow-main" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#7f1d1d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0503" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky-fire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e100c"/>
      <stop offset="100%" stop-color="#3d1308"/>
    </linearGradient>
    <linearGradient id="flame-outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="flame-mid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky-fire)"/>

  <!-- Campfire Atmospheric Ambient Glow -->
  <rect width="1600" height="900" fill="url(#fire-glow-main)"/>

  <!-- Forest Tree Silhouettes Left -->
  <g fill="#070403">
    <!-- Huge pine tree far left -->
    <polygon points="120,80 80,180 160,180"/>
    <polygon points="120,160 60,280 180,280"/>
    <polygon points="120,260 40,400 200,400"/>
    <polygon points="120,380 20,540 220,540"/>
    <polygon points="120,510 0,680 240,680"/>
    <rect x="105" y="680" width="30" height="150"/>

    <!-- Second pine tree mid-left -->
    <polygon points="320,180 280,280 360,280"/>
    <polygon points="320,260 260,380 380,380"/>
    <polygon points="320,360 240,500 400,500"/>
    <polygon points="320,480 220,640 420,640"/>
    <rect x="308" y="640" width="24" height="150"/>
  </g>

  <!-- Forest Tree Silhouettes Right -->
  <g fill="#070403">
    <!-- Huge pine tree far right -->
    <polygon points="1480,80 1440,180 1520,180"/>
    <polygon points="1480,160 1420,280 1540,280"/>
    <polygon points="1480,260 1400,400 1560,400"/>
    <polygon points="1480,380 1380,540 1580,540"/>
    <polygon points="1480,510 1360,680 1600,680"/>
    <rect x="1465" y="680" width="30" height="150"/>

    <!-- Second pine tree mid-right -->
    <polygon points="1280,180 1240,280 1320,280"/>
    <polygon points="1280,260 1220,380 1340,380"/>
    <polygon points="1280,360 1200,500 1360,500"/>
    <polygon points="1280,480 1180,640 1380,640"/>
    <rect x="1268" y="640" width="24" height="150"/>
  </g>

  <!-- Ground & Stone Fire Ring -->
  <path d="M0,740 Q400,720 800,725 T1600,735 L1600,900 L0,900 Z" fill="#080402"/>

  <!-- Campfire Stone Circle Pit -->
  <g transform="translate(800, 780)">
    <ellipse cx="-160" cy="10" rx="36" ry="22" fill="#262626"/>
    <ellipse cx="-110" cy="22" rx="42" ry="24" fill="#3f3f46"/>
    <ellipse cx="-45" cy="28" rx="46" ry="26" fill="#27272a"/>
    <ellipse cx="35" cy="28" rx="48" ry="25" fill="#3f3f46"/>
    <ellipse cx="105" cy="20" rx="42" ry="23" fill="#27272a"/>
    <ellipse cx="155" cy="10" rx="35" ry="20" fill="#3f3f46"/>
  </g>

  <!-- Glowing Wood Logs -->
  <g transform="translate(800, 730)">
    <!-- Log 1 (Left diagonal) -->
    <polygon points="-180,60 10,-30 40,-15 -150,75" fill="#3f1a0a"/>
    <polygon points="-160,50 0,-20 20,-10 -140,60" fill="#78350f"/>
    <!-- Glowing embers on log 1 -->
    <path d="M-120,40 L-40,-5" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <path d="M-100,45 L-20,0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

    <!-- Log 2 (Right diagonal) -->
    <polygon points="180,60 -10,-30 -40,-15 150,75" fill="#2e1205"/>
    <polygon points="160,50 0,-20 -20,-10 140,60" fill="#78350f"/>
    <!-- Glowing embers on log 2 -->
    <path d="M120,40 L40,-5" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <path d="M100,45 L20,0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

    <!-- Center Base Logs -->
    <rect x="-110" y="30" width="220" height="28" rx="14" fill="#451a03"/>
    <rect x="-80" y="36" width="160" height="16" rx="8" fill="#ea580c" opacity="0.8"/>
  </g>

  <!-- Blazing Fire Tongues -->
  <g transform="translate(800, 720)">
    <!-- Outer Flame Silhouette -->
    <path d="M-120,30 C-100,-40 -120,-120 -60,-220 C-30,-150 -10,-280 15,-340 C35,-260 70,-190 60,-120 C90,-160 120,-110 110,-40 C140,-10 120,40 100,40 Z" fill="url(#flame-outer)"/>

    <!-- Mid Flame Silhouette -->
    <path d="M-90,30 C-70,-30 -80,-100 -40,-180 C-10,-120 10,-220 30,-270 C50,-200 80,-140 50,-80 C70,-110 90,-70 80,-20 C100,10 90,40 70,40 Z" fill="url(#flame-mid)"/>

    <!-- Inner Core Hot Flame -->
    <path d="M-60,30 C-50,-20 -50,-80 -20,-140 C0,-90 10,-170 25,-210 C40,-150 50,-100 35,-50 C50,-70 60,-40 50,-10 C60,10 50,40 40,40 Z" fill="url(#flame-inner)"/>

    <!-- White-hot base core -->
    <ellipse cx="0" cy="20" rx="45" ry="35" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="5" cy="5" rx="30" ry="40" fill="#fef08a"/>
  </g>

  <!-- Flying Glowing Embers & Sparks -->
  <g fill="#fde047">
    <circle cx="780" cy="340" r="3.5" opacity="0.9"/><circle cx="820" cy="290" r="2.5" opacity="0.8"/><circle cx="760" cy="250" r="3" opacity="0.9"/>
    <circle cx="840" cy="210" r="2.2" opacity="0.8"/><circle cx="790" cy="170" r="3.2" opacity="0.9"/><circle cx="830" cy="130" r="2.8" opacity="0.7"/>
    <circle cx="770" cy="100" r="2" opacity="0.6"/><circle cx="810" cy="60" r="1.8" opacity="0.5"/><circle cx="730" cy="310" r="2.5" opacity="0.8"/>
    <circle cx="870" cy="330" r="3" opacity="0.8"/><circle cx="860" cy="260" r="2" opacity="0.7"/><circle cx="740" cy="200" r="2.2" opacity="0.8"/>
    <circle cx="700" cy="270" r="1.8" opacity="0.6"/><circle cx="890" cy="230" r="2" opacity="0.7"/><circle cx="800" cy="20" r="1.5" opacity="0.4"/>
  </g>
</svg>
