services:
  db:
    image: postgres:17-alpine
    container_name: schichtplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cevi_schichtplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${DB_NAME:-cevi_schichtplan_v2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Nur im internen Datennetz: nur das Backend erreicht die DB, kein Zugang ins Internet
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cevi_schichtplan} -d ${DB_NAME:-cevi_schichtplan_v2}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-cevi_schichtplan}:${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}@db:5432/${DB_NAME:-cevi_schichtplan_v2}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein (mind. 32 Zeichen)}
      COOKIE_DOMAIN: .${DOMAIN:-cevi-schichtplan.ch}
      CORS_ORIGIN: https://${DOMAIN:-cevi-schichtplan.ch}
      CEVIDB_BASE_URL: ${CEVIDB_BASE_URL:-https://db.cevi.ch}
      CEVIDB_CLIENT_ID: ${CEVIDB_CLIENT_ID:-}
      CEVIDB_CLIENT_SECRET: ${CEVIDB_CLIENT_SECRET:-}
      GLOBAL_ADMIN_CEVIDB_IDS: ${GLOBAL_ADMIN_CEVIDB_IDS:-}
      CEVIDB_OAUTH_SCOPES: ${CEVIDB_OAUTH_SCOPES:-}
      CEVIDB_ORTSGRUPPE_FIELD: ${CEVIDB_ORTSGRUPPE_FIELD:-}
      CEVIDB_DEPARTMENT_LEADER_ROLES: ${CEVIDB_DEPARTMENT_LEADER_ROLES:-}
      ADMIN_SESSION_MAX_HOURS: ${ADMIN_SESSION_MAX_HOURS:-}
      ADMIN_REQUIRE_CEVIDB_LOGIN: ${ADMIN_REQUIRE_CEVIDB_LOGIN:-}
      CEVIDB_STUFE_ROLE_PREFIX: ${CEVIDB_STUFE_ROLE_PREFIX:-}
      CEVIDB_STUFE_LEADER_ROLES: ${CEVIDB_STUFE_LEADER_ROLES:-}
      CEVIDB_STUFE_PARTICIPANT_ROLES: ${CEVIDB_STUFE_PARTICIPANT_ROLES:-}
      CEVIDB_REDIRECT_URI: ${CEVIDB_REDIRECT_URI:-https://login.${DOMAIN:-cevi-schichtplan.ch}/api/auth/cevidb/callback}
      SMTP_HOST: ${SMTP_HOST:-mail.infomaniak.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-admin@cevi-schichtplan.ch}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Cevi Schichtplan <admin@cevi-schichtplan.ch>}
      SHIFT_REMINDERS_ENABLED: ${SHIFT_REMINDERS_ENABLED:-false}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    # data = DB, app = Frontends, proxy = Traefik (auch Ausgang ins Internet: SMTP, Cevi.DB)
    networks:
      - data
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_prod_proxy"
      # API Endpunkte haben Vorrang auf allen Domains, Login und Subdomains (status.* hat eigene Uptime-Kuma-API)
      - "traefik.http.routers.schichtplan-api.rule=(Host(`${DOMAIN:-cevi-schichtplan.ch}`) || Host(`www.${DOMAIN:-cevi-schichtplan.ch}`) || Host(`login.${DOMAIN:-cevi-schichtplan.ch}`) || HostRegexp(`^[a-z0-9-]+[.]${DOMAIN:-cevi-schichtplan.ch}$$`)) && !Host(`status.${DOMAIN:-cevi-schichtplan.ch}`) && !Host(`dev.${DOMAIN:-cevi-schichtplan.ch}`) && (PathPrefix(`/api`) || Path(`/health`))"
      - "traefik.http.routers.schichtplan-api.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-api.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-api.priority=100"
      - "traefik.http.routers.schichtplan-api.service=schichtplan-api"
      - "traefik.http.services.schichtplan-api.loadbalancer.server.port=4000"
      # Zero-Downtime Healthcheck: Traefik leitet erst weiter, wenn der Container gesund ist
      - "traefik.http.services.schichtplan-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.schichtplan-api.loadbalancer.healthcheck.interval=2s"
      - "traefik.http.services.schichtplan-api.loadbalancer.healthcheck.timeout=1s"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_prod_proxy"
      # Dynamische Abteilungs-Subdomains (<abteilung>.cevi-schichtplan.ch)
      # Ohne dev.: sonst übernimmt Prod die Dev-Adresse, solange die Dev-Container nicht laufen (z. B. beim Neustart)
      - "traefik.http.routers.schichtplan-web.rule=HostRegexp(`^[a-z0-9-]+[.]${DOMAIN:-cevi-schichtplan.ch}$$`) && !Host(`dev.${DOMAIN:-cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-web.entrypoints=websecure"
      # Traefik leitet aus HostRegexp keine Zertifikats-Domains ab, deshalb explizit ein Wildcard-Zertifikat.
      # Wildcards gibt es nur via DNS-01: dnsresolver im zentralen Traefik (Infomaniak-API-Token).
      - "traefik.http.routers.schichtplan-web.tls.certresolver=dnsresolver"
      - "traefik.http.routers.schichtplan-web.tls.domains[0].main=${DOMAIN:-cevi-schichtplan.ch}"
      - "traefik.http.routers.schichtplan-web.tls.domains[0].sans=*.${DOMAIN:-cevi-schichtplan.ch}"
      - "traefik.http.routers.schichtplan-web.priority=10"
      - "traefik.http.routers.schichtplan-web.service=schichtplan-web"
      - "traefik.http.services.schichtplan-web.loadbalancer.server.port=3000"
      - "traefik.http.services.schichtplan-web.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-web.loadbalancer.healthcheck.interval=3s"

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_API_URL: http://backend:4000
      PRIVACY_CONTACT_NAME: ${PRIVACY_CONTACT_NAME:-}
      PRIVACY_CONTACT_STREET: ${PRIVACY_CONTACT_STREET:-}
      PRIVACY_CONTACT_CITY: ${PRIVACY_CONTACT_CITY:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_prod_proxy"
      # Hauptdomain und www (Marketing & Abteilungsauswahl)
      - "traefik.http.routers.schichtplan-landing.rule=Host(`${DOMAIN:-cevi-schichtplan.ch}`) || Host(`www.${DOMAIN:-cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-landing.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-landing.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-landing.priority=20"
      - "traefik.http.routers.schichtplan-landing.service=schichtplan-landing"
      - "traefik.http.services.schichtplan-landing.loadbalancer.server.port=3001"
      - "traefik.http.services.schichtplan-landing.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-landing.loadbalancer.healthcheck.interval=3s"

  login:
    build:
      context: .
      dockerfile: apps/login/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_prod_proxy"
      # Zentrales Login-Portal (Single Sign-On für alle Abteilungen)
      - "traefik.http.routers.schichtplan-login.rule=Host(`login.${DOMAIN:-cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-login.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-login.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-login.priority=30"
      - "traefik.http.routers.schichtplan-login.service=schichtplan-login"
      - "traefik.http.services.schichtplan-login.loadbalancer.server.port=3002"
      # Zero-Downtime Healthcheck
      - "traefik.http.services.schichtplan-login.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-login.loadbalancer.healthcheck.interval=2s"
      - "traefik.http.services.schichtplan-login.loadbalancer.healthcheck.timeout=1s"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_prod_proxy"
      # Admin-Portal: Verwaltung für globale Admins (Zugriff wird im Backend geprüft)
      - "traefik.http.routers.schichtplan-admin.rule=Host(`admin.${DOMAIN:-cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-admin.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-admin.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-admin.priority=30"
      - "traefik.http.routers.schichtplan-admin.service=schichtplan-admin"
      - "traefik.http.services.schichtplan-admin.loadbalancer.server.port=3003"
      - "traefik.http.services.schichtplan-admin.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-admin.loadbalancer.healthcheck.interval=3s"

  hilfe:
    build:
      context: .
      dockerfile: hilfe/Dockerfile
    restart: unless-stopped
    # Statisches HTML (nginx): braucht weder Backend noch DB, nur Traefik
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_prod_proxy"
      # Hilfe-Center (hilfe.cevi-schichtplan.ch), schlägt den Abteilungs-Wildcard (Priorität 10)
      - "traefik.http.routers.schichtplan-hilfe.rule=Host(`hilfe.${DOMAIN:-cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-hilfe.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-hilfe.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-hilfe.priority=30"
      - "traefik.http.routers.schichtplan-hilfe.service=schichtplan-hilfe"
      - "traefik.http.services.schichtplan-hilfe.loadbalancer.server.port=3004"
      - "traefik.http.services.schichtplan-hilfe.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-hilfe.loadbalancer.healthcheck.interval=5s"

# Netzwerk-Segmentierung (Prod). Dev läuft in docker-compose.staging.yml in komplett getrennten Netzen.
#   proxy: nur Traefik + die Schichtplan-Prod-Container (Einstieg von aussen), kein geteiltes web_proxy
#   app:   interne Verbindung Frontends <-> Backend, ohne Gateway
#   data:  interne Verbindung Backend <-> DB, ohne Gateway
networks:
  proxy:
    external: true
    name: schichtplan_prod_proxy
  # Feste Subnetze: der Docker-Standardpool des Servers ist ausgeschoepft ("all predefined address pools have been fully subnetted")
  app:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.77.1.0/24
  data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.77.2.0/24

volumes:
  postgres_data:
