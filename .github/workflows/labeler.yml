# Automatische Zuweisung von Bereichs-Labels anhand geänderter Pfade
# (pull_request_target: bewusst ohne Checkout des PR-Codes, es werden nur die Pfade gelesen)
name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: false
