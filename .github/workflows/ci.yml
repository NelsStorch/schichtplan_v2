# Typecheck und Tests bei jedem Push und Pull Request.
# Die API-Tests laufen gegen eine leere Postgres im Service-Container (nur für diesen Lauf).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: schichtplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d schichtplan_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/schichtplan_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Shared-Paket bauen und Prisma-Client erzeugen
        run: |
          npm run build --workspace=packages/shared
          npx --prefix apps/backend prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Migrationen auf die Test-DB
        run: npx --prefix apps/backend prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests
        run: npm test
