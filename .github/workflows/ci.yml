# Lint, Typecheck und Tests bei jedem Push und Pull Request, dazu ein Build der vier Frontends.
# Die API-Tests laufen gegen eine leere Postgres im Service-Container (nur für diesen Lauf).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: schichtplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d schichtplan_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/schichtplan_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Shared-Paket bauen
        run: npm run build --workspace=packages/shared

      - name: Prisma-Client erzeugen
        working-directory: apps/backend
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Migrationen auf die Test-DB
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests
        run: npm test

  # Die Frontends müssen sich bauen lassen (Typen allein reichen nicht: Next prüft auch Routen und Imports)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Shared-Paket bauen
        run: npm run build --workspace=packages/shared

      - name: Frontends bauen
        run: |
          npm run build --workspace=apps/web
          npm run build --workspace=apps/login
          npm run build --workspace=apps/landing
          npm run build --workspace=apps/admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"
