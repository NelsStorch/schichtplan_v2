services:
  db:
    image: postgres:17-alpine
    container_name: schichtplan-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cevi_schichtplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cevi_schichtplan_dev_pw}
      POSTGRES_DB: ${DB_NAME:-cevi_schichtplan_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cevi_schichtplan} -d ${DB_NAME:-cevi_schichtplan_dev}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: schichtplan-dev-backend
    restart: unless-stopped
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-cevi_schichtplan}:${DB_PASSWORD:-cevi_schichtplan_dev_pw}@db:5432/${DB_NAME:-cevi_schichtplan_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-development-key-min-32-chars}
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003"
      CEVIDB_BASE_URL: ${CEVIDB_BASE_URL:-https://db.cevi.ch}
      CEVIDB_CLIENT_ID: ${CEVIDB_CLIENT_ID:-}
      CEVIDB_CLIENT_SECRET: ${CEVIDB_CLIENT_SECRET:-}
      GLOBAL_ADMIN_CEVIDB_IDS: ${GLOBAL_ADMIN_CEVIDB_IDS:-}
      CEVIDB_OAUTH_SCOPES: ${CEVIDB_OAUTH_SCOPES:-}
      CEVIDB_ORTSGRUPPE_FIELD: ${CEVIDB_ORTSGRUPPE_FIELD:-}
      CEVIDB_DEPARTMENT_LEADER_ROLES: ${CEVIDB_DEPARTMENT_LEADER_ROLES:-}
      ADMIN_SESSION_MAX_HOURS: ${ADMIN_SESSION_MAX_HOURS:-}
      ADMIN_REQUIRE_CEVIDB_LOGIN: ${ADMIN_REQUIRE_CEVIDB_LOGIN:-}
      CEVIDB_STUFE_ROLE_PREFIX: ${CEVIDB_STUFE_ROLE_PREFIX:-}
      CEVIDB_STUFE_LEADER_ROLES: ${CEVIDB_STUFE_LEADER_ROLES:-}
      CEVIDB_STUFE_PARTICIPANT_ROLES: ${CEVIDB_STUFE_PARTICIPANT_ROLES:-}
      CEVIDB_REDIRECT_URI: ${CEVIDB_REDIRECT_URI:-http://localhost:3002/api/auth/cevidb/callback}
      # Pfadi (PBS MiData)
      MIDATA_BASE_URL: ${MIDATA_BASE_URL:-https://pbs.puzzle.ch}
      MIDATA_CLIENT_ID: ${MIDATA_CLIENT_ID:-}
      MIDATA_CLIENT_SECRET: ${MIDATA_CLIENT_SECRET:-}
      # Jubla (Jubla-DB)
      JUBLADB_BASE_URL: ${JUBLADB_BASE_URL:-https://db.jubla.ch}
      JUBLADB_CLIENT_ID: ${JUBLADB_CLIENT_ID:-}
      JUBLADB_CLIENT_SECRET: ${JUBLADB_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mail.infomaniak.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-admin@cevi-schichtplan.ch}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Cevi Schichtplan <admin@cevi-schichtplan.ch>}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/packages/shared/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: schichtplan-dev-web
    restart: unless-stopped
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      # Bind-Mounts unter Windows/macOS liefern keine FS-Events -> Polling für HMR & Tailwind
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      target: development
    container_name: schichtplan-dev-landing
    restart: unless-stopped
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3001
      # Bind-Mounts unter Windows/macOS liefern keine FS-Events -> Polling für HMR & Tailwind
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/landing/node_modules
      - /app/apps/landing/.next

  login:
    build:
      context: .
      dockerfile: apps/login/Dockerfile
      target: development
    container_name: schichtplan-dev-login
    restart: unless-stopped
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3002
      # Bind-Mounts unter Windows/macOS liefern keine FS-Events -> Polling für HMR & Tailwind
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/login/node_modules
      - /app/apps/login/.next

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: development
    container_name: schichtplan-dev-admin
    restart: unless-stopped
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3003
      # Bind-Mounts unter Windows/macOS liefern keine FS-Events -> Polling für HMR & Tailwind
      WATCHPACK_POLLING: "true"
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/apps/admin/.next

volumes:
  postgres_dev_data:
