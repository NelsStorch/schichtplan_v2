services:
  db:
    image: postgres:17-alpine
    container_name: schichtplan-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cevi_schichtplan_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${DB_NAME:-cevi_schichtplan_dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    # Nur im internen Datennetz: nur das Backend erreicht die DB, kein Zugang ins Internet
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cevi_schichtplan_dev} -d ${DB_NAME:-cevi_schichtplan_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-cevi_schichtplan_dev}:${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}@db:5432/${DB_NAME:-cevi_schichtplan_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein}
      DOMAIN: ${DOMAIN_DEV:-dev.cevi-schichtplan.ch}
      COOKIE_DOMAIN: .${DOMAIN_DEV:-dev.cevi-schichtplan.ch}
      # Eigener Name: das Prod-Cookie "token" wird auch an *.dev.<domain> gesendet
      COOKIE_NAME: token_dev
      CORS_ORIGIN: https://${DOMAIN_DEV:-dev.cevi-schichtplan.ch}
      CEVIDB_BASE_URL: ${CEVIDB_BASE_URL:-https://db.cevi.ch}
      CEVIDB_CLIENT_ID: ${CEVIDB_CLIENT_ID:-}
      CEVIDB_CLIENT_SECRET: ${CEVIDB_CLIENT_SECRET:-}
      GLOBAL_ADMIN_CEVIDB_IDS: ${GLOBAL_ADMIN_CEVIDB_IDS:-}
      CEVIDB_OAUTH_SCOPES: ${CEVIDB_OAUTH_SCOPES:-}
      CEVIDB_ORTSGRUPPE_FIELD: ${CEVIDB_ORTSGRUPPE_FIELD:-}
      CEVIDB_DEPARTMENT_LEADER_ROLES: ${CEVIDB_DEPARTMENT_LEADER_ROLES:-}
      ADMIN_SESSION_MAX_HOURS: ${ADMIN_SESSION_MAX_HOURS:-}
      ADMIN_REQUIRE_CEVIDB_LOGIN: ${ADMIN_REQUIRE_CEVIDB_LOGIN:-}
      CEVIDB_STUFE_ROLE_PREFIX: ${CEVIDB_STUFE_ROLE_PREFIX:-}
      CEVIDB_STUFE_LEADER_ROLES: ${CEVIDB_STUFE_LEADER_ROLES:-}
      CEVIDB_STUFE_PARTICIPANT_ROLES: ${CEVIDB_STUFE_PARTICIPANT_ROLES:-}
      CEVIDB_REDIRECT_URI: ${CEVIDB_REDIRECT_URI:-https://login.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}/api/auth/cevidb/callback}
      # Pfadi (PBS MiData): auf Dev die Integrationsumgebung pbs.puzzle.ch
      MIDATA_BASE_URL: ${MIDATA_BASE_URL:-https://pbs.puzzle.ch}
      MIDATA_CLIENT_ID: ${MIDATA_CLIENT_ID:-}
      MIDATA_CLIENT_SECRET: ${MIDATA_CLIENT_SECRET:-}
      # Jubla (Jubla-DB)
      JUBLADB_BASE_URL: ${JUBLADB_BASE_URL:-https://db.jubla.ch}
      JUBLADB_CLIENT_ID: ${JUBLADB_CLIENT_ID:-}
      JUBLADB_CLIENT_SECRET: ${JUBLADB_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mail.infomaniak.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-admin@cevi-schichtplan.ch}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_CEVI: ${SMTP_PASSWORD_CEVI:-${SMTP_PASSWORD:-}}
      SMTP_PASSWORD_PFADI: ${SMTP_PASSWORD_PFADI:-}
      SMTP_PASSWORD_JUBLA: ${SMTP_PASSWORD_JUBLA:-}
      SMTP_PASSWORD_VEREIN: ${SMTP_PASSWORD_VEREIN:-}
      SMTP_FROM: ${SMTP_FROM:-Cevi Schichtplan <admin@cevi-schichtplan.ch>}
      SHIFT_REMINDERS_ENABLED: ${SHIFT_REMINDERS_ENABLED:-false}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    # data = DB, app = Frontends, proxy = Traefik (auch Ausgang ins Internet: SMTP, Cevi.DB)
    networks:
      - data
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_dev_proxy"
      - "traefik.http.routers.schichtplan-dev-api.rule=(Host(`dev.cevi-schichtplan.ch`) || Host(`dev.pfadi-schichtplan.ch`) || Host(`dev.jubla-schichtplan.ch`) || Host(`dev.vereins-schichtplan.ch`) || Host(`login.dev.cevi-schichtplan.ch`) || Host(`login.dev.pfadi-schichtplan.ch`) || Host(`login.dev.jubla-schichtplan.ch`) || Host(`login.dev.vereins-schichtplan.ch`) || Host(`admin.dev.cevi-schichtplan.ch`) || HostRegexp(`^[a-z0-9-]+[.](dev[.]cevi-schichtplan[.]ch|dev[.]pfadi-schichtplan[.]ch|dev[.]jubla-schichtplan[.]ch|dev[.]vereins-schichtplan[.]ch)$$`)) && !Host(`status.dev.cevi-schichtplan.ch`) && !Host(`status.dev.pfadi-schichtplan.ch`) && !Host(`status.dev.jubla-schichtplan.ch`) && !Host(`status.dev.vereins-schichtplan.ch`) && (PathPrefix(`/api`) || Path(`/health`))"
      - "traefik.http.routers.schichtplan-dev-api.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-api.tls.certresolver=myresolver"
      # Höher als schichtplan-api (100) in Prod: dessen HostRegexp matcht auch dev.<domain>, ein Gleichstand wäre nur Glückssache
      - "traefik.http.routers.schichtplan-dev-api.priority=110"
      - "traefik.http.routers.schichtplan-dev-api.service=schichtplan-dev-api"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.server.port=4000"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.healthcheck.interval=2s"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.healthcheck.timeout=1s"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_dev_proxy"
      - "traefik.http.routers.schichtplan-dev-web.rule=HostRegexp(`^[a-z0-9-]+[.](dev[.]cevi-schichtplan[.]ch|dev[.]pfadi-schichtplan[.]ch|dev[.]jubla-schichtplan[.]ch|dev[.]vereins-schichtplan[.]ch)$$`)"
      - "traefik.http.routers.schichtplan-dev-web.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-web.tls.certresolver=dnsresolver"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[0].main=dev.cevi-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[0].sans=*.dev.cevi-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[1].main=dev.pfadi-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[1].sans=*.dev.pfadi-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[2].main=dev.jubla-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[2].sans=*.dev.jubla-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[3].main=dev.vereins-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[3].sans=*.dev.vereins-schichtplan.ch"
      - "traefik.http.routers.schichtplan-dev-web.priority=10"
      - "traefik.http.routers.schichtplan-dev-web.service=schichtplan-dev-web"
      - "traefik.http.services.schichtplan-dev-web.loadbalancer.server.port=3000"
      - "traefik.http.services.schichtplan-dev-web.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-dev-web.loadbalancer.healthcheck.interval=3s"

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_API_URL: http://backend:4000
      PRIVACY_CONTACT_NAME: ${PRIVACY_CONTACT_NAME:-}
      PRIVACY_CONTACT_STREET: ${PRIVACY_CONTACT_STREET:-}
      PRIVACY_CONTACT_CITY: ${PRIVACY_CONTACT_CITY:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_dev_proxy"
      - "traefik.http.routers.schichtplan-dev-landing.rule=Host(`dev.cevi-schichtplan.ch`) || Host(`dev.pfadi-schichtplan.ch`) || Host(`dev.jubla-schichtplan.ch`) || Host(`dev.vereins-schichtplan.ch`)"
      - "traefik.http.routers.schichtplan-dev-landing.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-landing.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-landing.priority=20"
      - "traefik.http.routers.schichtplan-dev-landing.service=schichtplan-dev-landing"
      - "traefik.http.services.schichtplan-dev-landing.loadbalancer.server.port=3001"
      - "traefik.http.services.schichtplan-dev-landing.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-dev-landing.loadbalancer.healthcheck.interval=3s"

  login:
    build:
      context: .
      dockerfile: apps/login/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_dev_proxy"
      - "traefik.http.routers.schichtplan-dev-login.rule=Host(`login.dev.cevi-schichtplan.ch`) || Host(`login.dev.pfadi-schichtplan.ch`) || Host(`login.dev.jubla-schichtplan.ch`) || Host(`login.dev.vereins-schichtplan.ch`)"
      - "traefik.http.routers.schichtplan-dev-login.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-login.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-login.priority=30"
      - "traefik.http.routers.schichtplan-dev-login.service=schichtplan-dev-login"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.server.port=3002"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.healthcheck.interval=2s"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.healthcheck.timeout=1s"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_dev_proxy"
      # Admin-Portal: Verwaltung für globale Admins (Zugriff wird im Backend geprüft)
      - "traefik.http.routers.schichtplan-dev-admin.rule=Host(`admin.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-dev-admin.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-admin.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-admin.priority=30"
      - "traefik.http.routers.schichtplan-dev-admin.service=schichtplan-dev-admin"
      - "traefik.http.services.schichtplan-dev-admin.loadbalancer.server.port=3003"
      - "traefik.http.services.schichtplan-dev-admin.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-dev-admin.loadbalancer.healthcheck.interval=3s"

  hilfe:
    build:
      context: .
      dockerfile: hilfe/Dockerfile
    restart: unless-stopped
    # Statisches HTML (nginx): braucht weder Backend noch DB, nur Traefik
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=schichtplan_dev_proxy"
      - "traefik.http.routers.schichtplan-dev-hilfe.rule=Host(`hilfe.dev.cevi-schichtplan.ch`) || Host(`hilfe.dev.pfadi-schichtplan.ch`) || Host(`hilfe.dev.jubla-schichtplan.ch`) || Host(`hilfe.dev.vereins-schichtplan.ch`)"
      - "traefik.http.routers.schichtplan-dev-hilfe.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-hilfe.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-hilfe.priority=30"
      - "traefik.http.routers.schichtplan-dev-hilfe.service=schichtplan-dev-hilfe"
      - "traefik.http.services.schichtplan-dev-hilfe.loadbalancer.server.port=3004"
      - "traefik.http.services.schichtplan-dev-hilfe.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.schichtplan-dev-hilfe.loadbalancer.healthcheck.interval=5s"

# Netzwerk-Segmentierung (Dev/Staging). Prod läuft in docker-compose.yml in komplett getrennten Netzen:
# kein gemeinsames Netz zwischen Dev und Prod, nur der zentrale Traefik hängt an beiden Proxy-Netzen.
#   proxy: nur Traefik + die Schichtplan-Dev-Container (Einstieg von aussen), kein geteiltes web_proxy
#   app:   interne Verbindung Frontends <-> Backend, ohne Gateway
#   data:  interne Verbindung Backend <-> DB, ohne Gateway
networks:
  proxy:
    external: true
    name: schichtplan_dev_proxy
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data_dev:
