services:
  db:
    image: postgres:17-alpine
    container_name: schichtplan-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cevi_schichtplan_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${DB_NAME:-cevi_schichtplan_dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - schichtplan_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cevi_schichtplan_dev} -d ${DB_NAME:-cevi_schichtplan_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-cevi_schichtplan_dev}:${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}@db:5432/${DB_NAME:-cevi_schichtplan_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein}
      DOMAIN: ${DOMAIN_DEV:-dev.cevi-schichtplan.ch}
      COOKIE_DOMAIN: .${DOMAIN_DEV:-dev.cevi-schichtplan.ch}
      CORS_ORIGIN: https://${DOMAIN_DEV:-dev.cevi-schichtplan.ch}
      CEVIDB_BASE_URL: ${CEVIDB_BASE_URL:-https://db.cevi.ch}
      CEVIDB_CLIENT_ID: ${CEVIDB_CLIENT_ID:-}
      CEVIDB_CLIENT_SECRET: ${CEVIDB_CLIENT_SECRET:-}
      GLOBAL_ADMIN_CEVIDB_IDS: ${GLOBAL_ADMIN_CEVIDB_IDS:-}
      CEVIDB_ORTSGRUPPE_FIELD: ${CEVIDB_ORTSGRUPPE_FIELD:-}
      CEVIDB_DEPARTMENT_LEADER_ROLES: ${CEVIDB_DEPARTMENT_LEADER_ROLES:-}
      CEVIDB_STUFE_ROLE_PREFIX: ${CEVIDB_STUFE_ROLE_PREFIX:-}
      CEVIDB_STUFE_LEADER_ROLES: ${CEVIDB_STUFE_LEADER_ROLES:-}
      CEVIDB_STUFE_PARTICIPANT_ROLES: ${CEVIDB_STUFE_PARTICIPANT_ROLES:-}
      CEVIDB_REDIRECT_URI: ${CEVIDB_REDIRECT_URI:-https://login.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}/api/auth/cevidb/callback}
      SMTP_HOST: ${SMTP_HOST:-mail.infomaniak.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-admin@cevi-schichtplan.ch}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Cevi Schichtplan <admin@cevi-schichtplan.ch>}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - schichtplan_dev_network
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.schichtplan-dev-api.rule=(Host(`${DOMAIN_DEV:-dev.cevi-schichtplan.ch}`) || Host(`login.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}`) || Host(`admin.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}`) || HostRegexp(`^[a-z0-9-]+[.]${DOMAIN_DEV:-dev.cevi-schichtplan.ch}$$`)) && (PathPrefix(`/api`) || Path(`/health`))"
      - "traefik.http.routers.schichtplan-dev-api.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-api.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-api.priority=100"
      - "traefik.http.routers.schichtplan-dev-api.service=schichtplan-dev-api"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.server.port=4000"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.healthcheck.interval=2s"
      - "traefik.http.services.schichtplan-dev-api.loadbalancer.healthcheck.timeout=1s"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - schichtplan_dev_network
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.schichtplan-dev-web.rule=HostRegexp(`^[a-z0-9-]+[.]${DOMAIN_DEV:-dev.cevi-schichtplan.ch}$$`)"
      - "traefik.http.routers.schichtplan-dev-web.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-web.tls.certresolver=dnsresolver"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[0].main=${DOMAIN_DEV:-dev.cevi-schichtplan.ch}"
      - "traefik.http.routers.schichtplan-dev-web.tls.domains[0].sans=*.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}"
      - "traefik.http.routers.schichtplan-dev-web.priority=10"
      - "traefik.http.routers.schichtplan-dev-web.service=schichtplan-dev-web"
      - "traefik.http.services.schichtplan-dev-web.loadbalancer.server.port=3000"
      - "traefik.http.services.schichtplan-dev-web.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.schichtplan-dev-web.loadbalancer.healthcheck.interval=3s"

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - schichtplan_dev_network
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.schichtplan-dev-landing.rule=Host(`${DOMAIN_DEV:-dev.cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-dev-landing.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-landing.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-landing.priority=20"
      - "traefik.http.routers.schichtplan-dev-landing.service=schichtplan-dev-landing"
      - "traefik.http.services.schichtplan-dev-landing.loadbalancer.server.port=3001"
      - "traefik.http.services.schichtplan-dev-landing.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.schichtplan-dev-landing.loadbalancer.healthcheck.interval=3s"

  login:
    build:
      context: .
      dockerfile: apps/login/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - schichtplan_dev_network
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.schichtplan-dev-login.rule=Host(`login.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-dev-login.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-login.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-login.priority=30"
      - "traefik.http.routers.schichtplan-dev-login.service=schichtplan-dev-login"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.server.port=3002"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.healthcheck.interval=2s"
      - "traefik.http.services.schichtplan-dev-login.loadbalancer.healthcheck.timeout=1s"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - schichtplan_dev_network
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      # Admin-Portal: Verwaltung für globale Admins (Zugriff wird im Backend geprüft)
      - "traefik.http.routers.schichtplan-dev-admin.rule=Host(`admin.${DOMAIN_DEV:-dev.cevi-schichtplan.ch}`)"
      - "traefik.http.routers.schichtplan-dev-admin.entrypoints=websecure"
      - "traefik.http.routers.schichtplan-dev-admin.tls.certresolver=myresolver"
      - "traefik.http.routers.schichtplan-dev-admin.priority=30"
      - "traefik.http.routers.schichtplan-dev-admin.service=schichtplan-dev-admin"
      - "traefik.http.services.schichtplan-dev-admin.loadbalancer.server.port=3003"
      - "traefik.http.services.schichtplan-dev-admin.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.schichtplan-dev-admin.loadbalancer.healthcheck.interval=3s"

networks:
  schichtplan_dev_network:
    driver: bridge
  web_proxy:
    external: true

volumes:
  postgres_data_dev:
